<svg xmlns="http://www.w3.org/2000/svg" viewBox="280 30 640 295" width="640" height="295" role="img" aria-label="the native family — pdfnative, zipnative, pkinative">
  <desc>Three engine marks of the native family, sharing the folded-corner mark and the #60A5FA to #2563EB gradient.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="#0f172a"/>

  <text x="600" y="64" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="19" letter-spacing="7" fill="#94a3b8">THE NATIVE FAMILY</text>

  <!-- pdfnative — document with the shared folded corner -->
  <g transform="translate(312,110) scale(2.8)">
    <g transform="translate(0.75,-0.4) scale(1.133)">
      <rect x="6" y="3" width="22" height="30" rx="3" fill="url(#grad)"/>
      <polygon points="24,3 28,3 28,8.5 24,3" fill="#DBEAFE" opacity="0.35"/>
      <path d="M24 3v5a1.5 1.5 0 001.5 1.5H28" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
      <rect x="10" y="12" width="14" height="1.8" rx="0.9" fill="#ffffff" opacity="0.95"/>
      <rect x="10" y="17" width="10" height="1.8" rx="0.9" fill="#ffffff" opacity="0.6"/>
      <rect x="10" y="22" width="14" height="1.8" rx="0.9" fill="#ffffff" opacity="0.95"/>
      <rect x="10" y="27" width="8" height="1.8" rx="0.9" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>

  <!-- zipnative — the zipper-cut Z, same folded corner -->
  <g transform="translate(544,110) scale(2.8)">
    <rect x="3" y="3" width="34" height="34" rx="8" fill="url(#grad)"/>
    <path d="M25.5 3h5a6 6 0 0 1 6.5 6.5V16L25.5 3z" fill="#DBEAFE" opacity="0.35"/>
    <path d="M25.5 3L37 16" stroke="#ffffff" stroke-width="0.8" opacity="0.35" fill="none"/>
    <path d="M10 10h20v4.6H20.3L30 24.4V30H10v-4.6h9.7L10 15.6z" fill="#ffffff"/>
    <g fill="url(#grad)">
      <path d="M21.21 17.54l2-2 2 2-2 2z"/>
      <path d="M25.09 21.46l2-2 2 2-2 2z"/>
      <path d="M12.85 20.5l2-2 2 2-2 2z"/>
      <path d="M16.73 24.42l2-2 2 2-2 2z"/>
    </g>
  </g>

  <!-- pkinative — shield and key -->
  <g transform="translate(776,110) scale(2.8)">
    <g transform="translate(0.59,0.57) scale(0.607)">
      <path d="M32 4 8 13v17c0 15 10.4 26.6 24 30 13.6-3.4 24-15 24-30V13Z" fill="url(#grad)"/>
      <circle cx="26" cy="30" r="8" fill="none" stroke="#ffffff" stroke-width="4"/>
      <path d="M33 30h15m-5 0v7m-5-7v5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">
    <text x="368" y="258" font-size="22" fill="#f1f5f9">pdfnative</text>
    <text x="600" y="258" font-size="22" fill="#f1f5f9">zipnative</text>
    <text x="832" y="258" font-size="22" fill="#f1f5f9">pkinative</text>
    <text x="368" y="286" font-size="14" letter-spacing="1.5" fill="#94a3b8">ISO 32000-1</text>
    <text x="600" y="286" font-size="14" letter-spacing="1.5" fill="#94a3b8">ISO/IEC 21320-1</text>
    <text x="832" y="286" font-size="14" letter-spacing="1.5" fill="#94a3b8">RFC 5280</text>
  </g>

  <rect x="300" y="312" width="600" height="2" fill="url(#rule)"/>
</svg>
